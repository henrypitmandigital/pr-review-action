# .github/workflows/pr-review-checks.yml
name: PR-review config checks

on:
  pull_request:
    paths:
      - '.github/pr-review/**'
      - '.github/workflows/pr-*'
      - '.pr_agent.toml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No secrets and no paid calls: safe on pull requests.
      - uses: OWNER/pr-review/checks@v1
        with:
          # Empty uses config.json max_call_usd; a value can only lower it.
          max-call-usd: ${{ vars.PR_REVIEW_MAX_CALL_USD }}
